<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">O gargalo mudou de lugar</title>
  <desc id="description">Diagrama editorial com dois dutos do ciclo de desenvolvimento: no desenho tradicional o estrangulamento fica em escrever codigo; no desenho AI-native ele se desloca para definir e revisar</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.55" stop-color="#131932"/>
      <stop offset="1" stop-color="#241b36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f28a4b" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f28a4b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b7c0df" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <linearGradient id="pipeOld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#202a4c"/>
      <stop offset="1" stop-color="#161d36"/>
    </linearGradient>
    <linearGradient id="pipeNew" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2340"/>
      <stop offset="1" stop-color="#2a1f2f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <circle cx="900" cy="330" r="320" fill="url(#glow)"/>

  <g transform="translate(78 86)">
    <rect width="92" height="7" rx="3.5" fill="#f28a4b"/>
    <text x="0" y="72" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">O GARGALO</text>
    <text x="0" y="139" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">MUDOU DE LUGAR</text>
    <text x="2" y="188" fill="#b7c0df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">Gerar código virou commodity.</text>
    <text x="2" y="218" fill="#b7c0df" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="500">O ciclo de desenvolvimento trocou de forma.</text>

    <g transform="translate(0 268)" filter="url(#shadow)">
      <rect width="504" height="118" rx="18" fill="#11172a" stroke="#7784ba" stroke-opacity="0.38"/>
      <text x="28" y="43" fill="#f28a4b" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4">SDLC AI-NATIVE</text>
      <text x="28" y="82" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700">HUMANOS DEFINEM · AGENTES EXECUTAM</text>
    </g>

    <text x="0" y="455" fill="#7f8ab5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">THIAGO PERARO · go.IAs 2026</text>
  </g>

  <g transform="translate(618 0)" filter="url(#shadow)">
    <text x="42" y="150" fill="#7f8ab5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4">SDLC TRADICIONAL</text>
    <path d="M42 176 L150 176 L182 208 L214 176 L500 176 L500 250 L214 250 L182 218 L150 250 L42 250 Z" fill="url(#pipeOld)" stroke="#7784ba" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="80" cy="213" r="7" fill="#b7c0df" fill-opacity="0.85"/>
    <circle cx="112" cy="213" r="7" fill="#b7c0df" fill-opacity="0.6"/>
    <circle cx="182" cy="213" r="6" fill="#f28a4b"/>
    <circle cx="300" cy="213" r="7" fill="#b7c0df" fill-opacity="0.35"/>
    <circle cx="360" cy="213" r="7" fill="#b7c0df" fill-opacity="0.25"/>
    <rect x="118" y="272" width="128" height="32" rx="16" fill="#f28a4b"/>
    <text x="182" y="293" text-anchor="middle" fill="#111420" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2">ESCREVER</text>

    <path d="M266 318 L266 350 M258 342 L266 352 L274 342" stroke="#f28a4b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="42" y="392" fill="#7f8ab5" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4">SDLC AI-NATIVE</text>
    <path d="M42 418 L358 418 L390 450 L422 418 L500 418 L500 492 L422 492 L390 460 L358 492 L42 492 Z" fill="url(#pipeNew)" stroke="#f28a4b" stroke-opacity="0.75" stroke-width="2"/>
    <circle cx="80" cy="455" r="7" fill="#b7c0df" fill-opacity="0.85"/>
    <circle cx="112" cy="455" r="7" fill="#b7c0df" fill-opacity="0.85"/>
    <circle cx="144" cy="455" r="7" fill="#b7c0df" fill-opacity="0.85"/>
    <circle cx="176" cy="455" r="7" fill="#b7c0df" fill-opacity="0.7"/>
    <circle cx="208" cy="455" r="7" fill="#b7c0df" fill-opacity="0.7"/>
    <circle cx="240" cy="455" r="7" fill="#b7c0df" fill-opacity="0.55"/>
    <circle cx="272" cy="455" r="7" fill="#b7c0df" fill-opacity="0.55"/>
    <circle cx="390" cy="455" r="6" fill="#f28a4b"/>
    <rect x="312" y="514" width="156" height="32" rx="16" fill="#f28a4b"/>
    <text x="390" y="535" text-anchor="middle" fill="#111420" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.2">DEFINIR E REVISAR</text>
  </g>
</svg>
