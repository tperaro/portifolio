<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AIOS and enterprise second brain</title>
  <desc id="description">Editorial diagram connecting context, action, evidence, and memory</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.55" stop-color="#131932"/>
      <stop offset="1" stop-color="#241b36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f28a4b" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f28a4b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#b7c0df" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="url(#background)"/>
  <rect width="1200" height="630" rx="28" fill="url(#grid)"/>
  <circle cx="882" cy="315" r="300" fill="url(#glow)"/>

  <g transform="translate(78 86)">
    <rect width="92" height="7" rx="3.5" fill="#f28a4b"/>
    <text x="0" y="72" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">AIOS +</text>
    <text x="0" y="143" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">SECOND BRAIN</text>
    <text x="2" y="194" fill="#b7c0df" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="500">The infrastructure for AI that learns with the business.</text>

    <g transform="translate(0 276)" filter="url(#shadow)">
      <rect width="498" height="118" rx="18" fill="#11172a" stroke="#7784ba" stroke-opacity="0.38"/>
      <text x="28" y="43" fill="#f28a4b" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="2.4">THE CAEM LOOP</text>
      <text x="28" y="82" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">CONTEXT → ACTION → EVIDENCE → MEMORY</text>
    </g>

    <text x="0" y="463" fill="#7f8ab5" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">THIAGO PERARO · AI ARCHITECTURE</text>
  </g>

  <g transform="translate(730 115)" filter="url(#shadow)">
    <circle cx="176" cy="200" r="164" fill="#12182b" stroke="#f28a4b" stroke-width="3" stroke-opacity="0.9"/>
    <circle cx="176" cy="200" r="119" fill="#0d1222" stroke="#7c8cce" stroke-width="3" stroke-dasharray="9 10"/>
    <circle cx="176" cy="200" r="63" fill="#f28a4b"/>
    <text x="176" y="195" text-anchor="middle" fill="#111420" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="1.4">BETTER</text>
    <text x="176" y="219" text-anchor="middle" fill="#111420" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="1.4">DECISIONS</text>

    <rect x="113" y="-8" width="126" height="34" rx="17" fill="#f28a4b"/>
    <text x="176" y="14" text-anchor="middle" fill="#111420" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="900" letter-spacing="1.3">AIOS</text>

    <rect x="75" y="372" width="202" height="34" rx="17" fill="#202a4c" stroke="#7784ba"/>
    <text x="176" y="394" text-anchor="middle" fill="#f5f7ff" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="1.1">ENTERPRISE MEMORY</text>

    <g fill="#b7c0df" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      <text x="176" y="74" text-anchor="middle">GOVERNANCE</text>
      <text x="297" y="205">TOOLS</text>
      <text x="176" y="337" text-anchor="middle">LEARNING</text>
      <text x="-2" y="205">CONTEXT</text>
    </g>
  </g>
</svg>
